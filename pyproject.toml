[project]
name = "cs50-flask-todo-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.2.0",
    "flask>=3.1.3",
    "flask-session>=0.8.0",
    "python-dotenv>=1.2.2",
    "werkzeug>=3.1.6",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "poethepoet>=0.45.0",
    "ruff>=0.15.12",
]

[tool.mypy]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Enable Pyflakes (F), Error (E), and isort (I)
select = ["E", "F", "I"]

[tool.poe.tasks]
dev = "python app.py"
typecheck = "mypy ."
lint = "ruff check ."
format = "ruff format ."
check = ["lint", "typecheck"]
db-init = "python db.py auto"
db-reset = "python db.py reset"
