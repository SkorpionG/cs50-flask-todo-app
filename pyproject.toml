[project]
name = "cs50-flask-todo-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.2.0",
    "flask>=3.1.1",
    "flask-session>=0.8.0",
    "python-dotenv>=1.1.1",
    "werkzeug>=3.1.3",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "poethepoet>=0.45.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.15.12",
]

[tool.mypy]
python_version = "3.13"
files = ["app", "run.py", "tests"]
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# E/W: pycodestyle, F: Pyflakes, I: isort, UP: pyupgrade, B: flake8-bugbear
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.poe.tasks]
dev = "flask --app app run --debug"
test = "pytest"
typecheck = "mypy"
lint = "ruff check ."
lint-fix = "ruff check --fix ."
format = "ruff format ."
format-check = "ruff format --check ."
check = ["lint", "format-check", "typecheck", "test"]
db-init = "python -m app.db auto"
db-reset = "python -m app.db reset"
